[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyper-hyperparameters"
version = "0.1.0"
requires-python = ">=3.10,<3.12"
dependencies = [
  "numpy==1.24.4",
  "scipy==1.15.2",
  "ConfigSpace==1.2.1",
  "smac==2.3.1",
  "pyrfr==0.9.0",
  "PyYAML>=6.0",
  "jax==0.4.28",
  "jaxlib==0.4.28",
  "flax==0.8.2",
  "chex==0.1.86",
  "distrax==0.1.5",
  "flashbax==0.1.2",
  "gymnax==0.0.6",
  "brax==0.10.3",
  "mujoco==3.1.4",
  "mujoco-mjx==3.1.4",
  "optax==0.2.3",
  "gymnasium==1.2.0",
  "jaxopt==0.8.5",
  "omegaconf==2.3.0",
  "pandas==2.1.1",
]

[tool.setuptools]
packages = ["hhsens"]
